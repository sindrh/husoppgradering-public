	for (const [part, indices] of Object.entries(MODEL.parts)) {
		const geo = new THREE.BufferGeometry();
		geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
		geo.setIndex(indices);
		const nonIndexed = geo.toNonIndexed(); // flat shading for crisp box faces
		nonIndexed.computeVertexNormals();
		if (!materials[part]) {
			materials[part] = part.startsWith("#")
				? new THREE.MeshLambertMaterial({ color: new THREE.Color(part) })
				: materials.wall;
		}
		const mesh = new THREE.Mesh(nonIndexed, materials[part]);
		if (part === "glass") mesh.renderOrder = 1;
		model.add(mesh);
		meshes[part] = mesh;

		if (part !== "glass" && part !== "label") {
			const edges = new THREE.LineSegments(
				new THREE.EdgesGeometry(nonIndexed, 25),
				new THREE.LineBasicMaterial({ color: 0x4a4f55, transparent: true, opacity: 0.55 })
			);
			model.add(edges);
		}
	}
	scene.add(model);

	// Bounds
	const box = new THREE.Box3().setFromObject(model);
	const center = box.getCenter(new THREE.Vector3());
	const size = box.getSize(new THREE.Vector3());
	const radius = size.length() / 2;

	// Ground plane
	const ground = new THREE.Mesh(
		new THREE.PlaneGeometry(radius * 40, radius * 40),
		new THREE.MeshBasicMaterial({ color: 0xe2e5e8 })
	);
	ground.position.set(center.x, center.y, -2);
	scene.add(ground);

	// Compass letters around the model
	function textSprite(text) {
		const c = document.createElement("canvas");
		c.width = c.height = 128;
		const g = c.getContext("2d");
		g.fillStyle = "#2f6fb0";
		g.beginPath(); g.arc(64, 64, 56, 0, Math.PI * 2); g.fill();
		g.fillStyle = "#fff";
		g.font = "bold 72px system-ui, sans-serif";
		g.textAlign = "center"; g.textBaseline = "middle";
		g.fillText(text, 64, 68);
		const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
		s.scale.set(700, 700, 1);
		return s;
	}
	const pad = 1200;
	const compass = [
		["N", center.x, box.max.y + pad],
		["S", center.x, box.min.y - pad],
		["Ø", box.max.x + pad, center.y],
		["V", box.min.x - pad, center.y],
	];
	for (const [t, x, y] of compass) {
		const s = textSprite(t);
		s.position.set(x, y, 1500);
		scene.add(s);
	}

	const controls = new THREE.OrbitControls(camera, renderer.domElement);
	controls.enableDamping = true;
	controls.dampingFactor = 0.1;
	controls.maxPolarAngle = Math.PI * 0.495;
	controls.minDistance = 1000;
	controls.maxDistance = radius * 8;

	// View presets: direction from model centre to camera
	const VIEWS = {
		iso:   new THREE.Vector3(0.75, -1, 0.9),
		top:   new THREE.Vector3(0, -0.001, 1),
		south: new THREE.Vector3(0, -1, 0.2),
		north: new THREE.Vector3(0, 1, 0.2),
		east:  new THREE.Vector3(1, 0, 0.2),
		west:  new THREE.Vector3(-1, 0, 0.2),
	};
	function fitDistance() {
		const vFov = THREE.MathUtils.degToRad(camera.fov);
		const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
		return radius / Math.sin(Math.min(vFov, hFov) / 2) * 0.95;
	}
	let anim = null;
	function setView(name, instant) {
		const dir = VIEWS[name].clone().normalize();
		const target = center.clone();
		const to = target.clone().add(dir.multiplyScalar(fitDistance()));
		document.querySelectorAll("[data-view]").forEach(b =>
			b.setAttribute("aria-pressed", String(b.dataset.view === name)));
		if (instant) {
			camera.position.copy(to);
			controls.target.copy(target);
			return;
		}
		anim = { from: camera.position.clone(), fromT: controls.target.clone(), to, toT: target, t: 0 };
	}
	document.querySelectorAll("[data-view]").forEach(b =>
		b.addEventListener("click", () => setView(b.dataset.view)));
	controls.addEventListener("start", () => {
		anim = null;
		document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", "false"));
	});

	document.getElementById("labels").addEventListener("change", e => {
		if (meshes.label) meshes.label.visible = e.target.checked;
	});

	function resize() {
		const w = container.clientWidth, h = container.clientHeight;
		renderer.setSize(w, h);
		camera.aspect = w / h;
		camera.updateProjectionMatrix();
	}
	window.addEventListener("resize", resize);
	resize();
	setView("iso", true);

	(function loop() {
		requestAnimationFrame(loop);
		if (anim) {
			anim.t = Math.min(1, anim.t + 0.06);
			const k = 1 - Math.pow(1 - anim.t, 3);
			camera.position.lerpVectors(anim.from, anim.to, k);
			controls.target.lerpVectors(anim.fromT, anim.toT, k);
			if (anim.t >= 1) anim = null;
		}
		controls.update();
		renderer.render(scene, camera);
	})();
})();
</script>
</body>
</html>
